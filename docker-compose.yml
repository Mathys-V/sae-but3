version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: evil_mescours_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evil_user
      POSTGRES_PASSWORD: evil_password
      POSTGRES_DB: evil_mescours_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evil_network

    
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: evil_mescours_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://evil_user:evil_password@db:5432/evil_mescours_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - evil_network
    
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: evil_mescours_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - evil_network

volumes:
  postgres_data:

networks:
  evil_network:
    driver: bridge
